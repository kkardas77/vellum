<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch — Vellum Records</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:#0a0806;color:#e8e2d9;font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;}

nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 32px;
  background:linear-gradient(to bottom,rgba(6,4,2,0.8) 0%,transparent 100%);
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.lv{font-weight:500;font-size:12px;letter-spacing:0.28em;text-transform:uppercase;color:#e8e2d9;}
.lp{width:1.5px;height:13px;background:#c9a84c;flex-shrink:0;}
.lr{font-weight:300;font-size:12px;letter-spacing:0.28em;text-transform:uppercase;color:#e8e2d9;}
.nav-back{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(232,226,217,0.4);text-decoration:none;transition:color 0.3s;}
.nav-back:hover{color:#e8e2d9;}

.grain{
  position:fixed;inset:0;z-index:1;opacity:0.06;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px;
}

.contact-section{
  position:relative;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.contact-bg{
  position:absolute;inset:0;z-index:0;
}
.contact-bg img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  filter:brightness(0.3);
}
.contact-bg-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(11,9,6,0.6) 0%,rgba(11,9,6,0.2) 50%,rgba(11,9,6,0.8) 100%);
}
.contact-inner{
  position:relative;z-index:2;
  text-align:center;
  padding:48px 24px;
  max-width:480px;
  margin:0 auto;
}
.contact-label{
  font-size:10px;letter-spacing:0.42em;text-transform:uppercase;
  color:rgba(201,168,76,0.7);
  margin-bottom:40px;
}
.contact-email{
  display:block;
  font-size:18px;font-weight:300;
  color:#e8e2d9;
  text-decoration:none;
  letter-spacing:0.08em;
  margin-bottom:56px;
  transition:color 0.3s;
}
.contact-email:hover{color:#c9a84c;}
.social-icons{
  display:flex;gap:36px;justify-content:center;align-items:center;
}
.social-icons a{
  color:rgba(240,236,228,0.45);
  text-decoration:none;
  transition:color 0.3s;
}
.social-icons a:hover{color:#c9a84c;}
.contact-location{
  margin-top:56px;
  font-size:10px;letter-spacing:0.2em;
  color:rgba(240,236,228,0.2);
  text-transform:uppercase;
}
</style>
</head>
<body>

<div class="grain"></div>

<nav>
  <a href="index.html" class="logo">
    <span class="lv">Vellum</span>
    <span class="lp"></span>
    <span class="lr">Records</span>
  </a>
  <a href="index.html" class="nav-back">&#8592; Back</a>
</nav>

<section class="contact-section">
  <div class="contact-bg">
    <img src="contact-bg.jpg" alt="">
    <div class="contact-bg-overlay"></div>
  </div>
  <div class="contact-inner">
    <p class="contact-label">Get in touch</p>
    <a href="mailto:hello@vellumrecords.com" class="contact-email">hello@vellumrecords.com</a>
    <div class="social-icons">
      <a href="https://www.instagram.com/vellum.records" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://www.tiktok.com/@vellumrecords" target="_blank" rel="noopener" aria-label="TikTok">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/></svg>
      </a>
    </div>
    <p class="contact-location">Warsaw, Poland</p>
  </div>
</section>

</body>
</html>
