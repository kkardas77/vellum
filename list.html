<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the List — Vellum Records</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #0a0806; display: flex; align-items: center; justify-content: center; }

  .page-bg {
    position: fixed; inset: 0;
    background: url('drop-bg.png') center/cover no-repeat;
    opacity: 0.55; z-index: 0;
  }
  .page-vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.88) 100%);
    z-index: 1;
  }

  /* logo */
  .logo { display:flex; align-items:center; gap:8px; text-decoration:none; }
  .lv { font-weight:500; font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:#e8e2d9; }
  .lp { width:1.5px; height:13px; background:#c9a84c; flex-shrink:0; }
  .lr { font-weight:300; font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:#e8e2d9; }

  /* dwa wielkie statyczne planety z krawędzi */
  .disc-bg {
    position: fixed; z-index: 0;
    border-radius: 50%;
    background: url('cover-vlm001.png') center/cover no-repeat;
    filter: blur(28px) brightness(0.7);
    pointer-events: none;
  }
  .disc-bg-1 {
    width: 620px; height: 620px;
    top: 50%; left: 0;
    transform: translate(-30%, -50%);
  }
  .disc-bg-2 {
    width: 540px; height: 540px;
    top: 50%; left: 100%;
    transform: translate(-25%, -50%);
    filter: blur(36px) brightness(0.6);
  }

  .wrap {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; width: 100%;
  }

  .headline {
    font-family: 'Courier New', monospace;
    font-size: clamp(15px, 3vw, 22px);
    letter-spacing: 0.42em; text-transform: uppercase;
    color: #e8e2d9; text-align: center; margin-bottom: 6px;
  }
  .subline {
    font-family: 'Courier New', monospace;
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: #4a4030; text-align: center; margin-bottom: 36px;
  }

  .form-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; width: 100%; max-width: 340px;
  }
  .input-row { display: flex; width: 100%; }
  .email-in {
    flex: 1; background: rgba(0,0,0,0.7);
    border: 1px solid #c9a84c44; border-right: none;
    color: #e8e2d9; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 1px;
    padding: 13px 16px; outline: none; transition: border-color 0.2s;
  }
  .email-in::placeholder { color: #2e2820; }
  .email-in:focus { border-color: #c9a84c77; }
  .submit-btn {
    background: transparent; border: 1px solid #c9a84c44; color: #c9a84c;
    font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    padding: 13px 18px; cursor: pointer; white-space: nowrap; transition: all 0.25s;
  }
  .submit-btn:hover { background: #c9a84c15; border-color: #c9a84c88; }

  .rodo-label {
    font-family: 'Courier New', monospace;
    font-size: 9px; color: #3d3830; letter-spacing: 0.06em;
    line-height: 1.7; max-width: 340px;
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
  }
  .rodo-label input { accent-color: #c9a84c; flex-shrink: 0; margin-top: 3px; }
  .rodo-label a { color: #5a5040; text-decoration: none; border-bottom: 1px solid #3a3328; }
  .rodo-label a:hover { color: #c9a84c; }

  .success-msg {
    font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #c9a84c; text-align: center; display: none; padding: 24px 0; line-height: 2;
  }

  .back-link {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: #252018; text-decoration: none; z-index: 10; transition: color 0.2s;
  }
  .back-link:hover { color: #6a6050; }

  @media (max-width: 480px) {
    .disc-bg-1 { width: 360px; height: 360px; transform: translate(-30%, -50%); }
    .disc-bg-2 { width: 300px; height: 300px; transform: translate(-25%, -50%); }
    .spin-wrap { width: 130px; height: 130px; }
    .cover-spin { width: 130px; height: 130px; }
  }
</style>
</head>
<body>

<div class="page-bg"></div>
<div class="page-vignette"></div>
<div class="disc-bg disc-bg-1"></div>
<div class="disc-bg disc-bg-2"></div>

<a class="logo" style="position:fixed;top:28px;left:28px;z-index:10;" href="index.html">
  <span class="lv">Vellum</span><span class="lp"></span><span class="lr">Records&#8482;</span>
</a>

<div class="wrap">

  <div class="headline" style="margin-top:60px;">Join the List</div>
  <div class="subline">One pressing. No repress.</div>

  <div class="form-wrap" id="listForm">
    <div class="input-row">
      <input type="email" class="email-in" id="listEmail" placeholder="your@email.com">
      <button class="submit-btn" onclick="submitList()">Subscribe</button>
    </div>
    <label class="rodo-label">
      <input type="checkbox" id="listRodo">
      <span>I agree to the processing of my email address by Vellum Records
      for the purpose of receiving release notifications.
      <a href="privacy.html" target="_blank">Privacy Policy</a>.</span>
    </label>
    <div class="success-msg" id="listSuccess">You&#8217;re on the list.<br>We&#8217;ll be in touch.</div>
  </div>
</div>

<a class="back-link" href="javascript:history.back()">&#8592; back</a>

<script>
function submitList() {
  var input = document.getElementById('listEmail');
  var rodo  = document.getElementById('listRodo');
  var email = input.value.trim();
  if (!email || !/^[^@]+@[^@]+[.][^@]+$/.test(email)) {
    input.style.borderColor = '#6b2a2a';
    input.placeholder = 'enter a valid email';
    return;
  }
  if (!rodo.checked) {
    rodo.parentElement.style.color = '#8b5a3a';
    return;
  }
  var url  = 'https://docs.google.com/forms/d/e/1FAIpQLSftXWuoUBN023bXD5mrb-d-FS1EqZF12Bas1kmY6EH8521cIg/formResponse';
  var body = new FormData();
  body.append('entry.1491947319', email);
  fetch(url, { method: 'POST', mode: 'no-cors', body: body });
  document.getElementById('listForm').querySelector('.input-row').style.display = 'none';
  document.getElementById('listForm').querySelector('.rodo-label').style.display = 'none';
  document.getElementById('listSuccess').style.display = 'block';
}
</script>
</body>
</html>
